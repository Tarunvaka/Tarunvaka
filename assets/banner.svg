<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t">
  <title id="t">Tarun Vaka — Data Science, ML, GenAI and content creator</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F0F0F0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#121212" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#121212" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .d { fill: #F0F0F0; fill-opacity: .38; }
    .fit { fill: none; stroke: #E0F11F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    /* animations only add an entrance: if a renderer skips them, the final frame is what shows */
    @media (prefers-reduced-motion: no-preference) {
      .d, .o { animation: pop .5s ease-out backwards; }
      .fit { stroke-dasharray: 700; animation: draw 1.6s cubic-bezier(.3,.7,.2,1) .5s backwards; }
      .ring { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
      .tag { animation: pop .6s ease-out 2.1s backwards; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    }
    @keyframes pop { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 700; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1280" height="440" rx="20" fill="#121212"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <rect width="760" height="440" rx="20" fill="url(#fade)"/>

  <!-- eyebrow -->
  <rect x="72" y="70" width="10" height="10" fill="#E0F11F"/>
  <text x="94" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.5" fill="#E0F11F">DATA SCIENCE · ML · GENAI + CONTENT CREATOR</text>

  <!-- name (textLength keeps layout identical whatever font the viewer has) -->
  <text x="66" y="236" font-family="'Big Shoulders Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="150" textLength="430" lengthAdjust="spacingAndGlyphs" fill="#F0F0F0">TARUN</text>
  <text x="66" y="362" font-family="'Big Shoulders Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="150" textLength="350" lengthAdjust="spacingAndGlyphs" fill="#E0F11F">VAKA</text>

  <!-- footer line -->
  <text x="72" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#8A8A8A">MS DATA SCIENCE @ RUTGERS · CAMDEN, NJ</text>
  <text x="1196" y="404" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#E0F11F">TARUNVAKA.COM<tspan class="cursor">_</tspan></text>

